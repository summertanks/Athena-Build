# /etc/NetworkManager/conf.d/10-asgard-managed.conf
#
# Shipped by asgard-gnome-desktop (Asgard GNOME desktop metapackage).
# Tells NetworkManager to manage every device by default, even when
# /etc/network/interfaces has a non-loopback stanza for it.
#
# Why: a fresh debootstrap-based install leaves a default `eth0` (or
# similar) entry in /etc/network/interfaces from the installer's DHCP
# setup.  Stock NetworkManager defers managed=false on any device
# ifupdown already owns, GNOME Shell sees zero NM-managed devices,
# and the top-bar network indicator never appears.
#
# This drop-in flips that default — NM takes over every interface,
# the indicator appears, GNOME's network UI works as a fresh user
# expects.
#
# Operator override: edit this file (dpkg treats it as a conffile,
# so the edit survives package upgrades), or drop a higher-numbered
# *.conf in /etc/NetworkManager/conf.d/ to override specific keys.

[ifupdown]
managed=true
