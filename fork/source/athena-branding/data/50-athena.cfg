# /etc/default/grub.d/50-athena.cfg — shipped by athena-branding.
#
# Stock /etc/default/grub on Debian ships:
#     GRUB_DISTRIBUTOR=`lsb_release -i -s 2>/dev/null || echo Debian`
# which falls back to literal "Debian" whenever `lsb_release` either
# isn't installed or returns no result, regardless of /etc/os-release
# content.  /etc/grub.d/00_header sources files in /etc/default/grub.d/
# AFTER /etc/default/grub, so this override takes effect on every
# `update-grub` (run automatically by grub-pc / grub-efi-amd64
# postinst hooks).
#
# Reflected in:
#   - GRUB menu title ("@DISTRIBUTION@ GNU/Linux")
#   - menuentry descriptions for the installed kernel + advanced menu
GRUB_DISTRIBUTOR="@DISTRIBUTION@"

# Boot-menu background image.  /etc/grub.d/05_debian_theme picks up
# GRUB_BACKGROUND= and embeds it into the generated /boot/grub/grub.cfg
# via `background_image`.  PNG ships from athena-branding's debian/install;
# rsvg-convert renders it at 1920x1080 from data/aegis-dark.svg at build
# time.  GRUB scales to lower-res displays automatically; 4:3 monitors
# letterbox cleanly.  Path mirrors the upstream-desktop-base convention
# (own dir under /usr/share/) but under our pkg's namespace since we
# displace desktop-base via Provides+Conflicts+Replaces.
GRUB_BACKGROUND="/usr/share/athena-branding/grub-background.png"
