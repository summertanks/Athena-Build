# /etc/default/grub.d/50-athena.cfg — shipped by athena-branding.
#
# Stock /etc/default/grub on Debian ships:
#     GRUB_DISTRIBUTOR=`lsb_release -i -s 2>/dev/null || echo Debian`
# which falls back to literal "Debian" whenever `lsb_release` either
# isn't installed or returns no result, regardless of /etc/os-release
# content.  /etc/grub.d/00_header sources files in /etc/default/grub.d/
# AFTER /etc/default/grub, so this override takes effect on every
# `update-grub` (run automatically by grub-pc / grub-efi-amd64
# postinst hooks).
#
# Reflected in:
#   - GRUB menu title ("@DISTRIBUTION@ GNU/Linux")
#   - menuentry descriptions for the installed kernel + advanced menu
GRUB_DISTRIBUTOR="@DISTRIBUTION@"
