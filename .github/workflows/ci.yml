name: ci

# Runs lint (ruff + mypy) and unit tests on every push to master and
# every PR.  Ruff and mypy config live in pyproject.toml so the local
# invocation
#
#     ruff check .
#     mypy scripts/
#
# matches what CI runs.  Both linters use the conservative initial
# rulesets in pyproject (ruff: F + E9 only; mypy: untyped-defs not
# checked) so the gate stays honest rather than green-washing the
# codebase's current discipline.  Tightening is a follow-on ticket.
#
# mypy used to be `continue-on-error: true` while the codebase had a
# baseline of ~100 findings; cleaned end-to-end 2026-05-14 and mypy
# is now a hard gate.

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  ruff:
    name: ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install ruff
        run: pip install ruff
      - name: Run ruff
        run: ruff check .

  mypy:
    name: mypy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install mypy + minimal type stubs
        run: pip install mypy types-requests types-psutil
      - name: Run mypy
        # ignore_missing_imports = true in pyproject covers apt_pkg /
        # debian / docker which have partial or absent stubs on PyPI.
        run: mypy scripts/

  tests:
    name: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Use the runner's *system* Python (3.12 on ubuntu-24.04) rather
      # than actions/setup-python.  Reason: python3-apt only ships as a
      # Debian package and its compiled apt_pkg.so is ABI-bound to the
      # system interpreter; the toolcache Python from setup-python can't
      # import it.  Several test modules transitively import apt_pkg
      # (chroot, package, dependencytree, buildsystem, cache, dep_drift)
      # so without this they fail with ModuleNotFoundError.
      #
      # debian-archive-keyring satisfies BuildConfig's Security.Keyring
      # default path /usr/share/keyrings/debian-archive-keyring.gpg —
      # without it test_buildconfig_parses_three_mirrors fails.
      #
      # The remaining python3-* packages mirror what
      # tests/test_module.py imports: python-debian (Source/Package/
      # DebFile parsers), python-gnupg (verify_inrelease), requests
      # (download_file mocks), psutil (Tui resource probe).
      - name: Install system Debian-only deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
              python3-apt \
              python3-debian \
              python3-gnupg \
              python3-requests \
              python3-psutil \
              python3-docker \
              debian-archive-keyring
      - name: Run unit tests
        run: python3 tests/test_module.py
