# tests/installer-smoke/preseed.cfg — fully unattended install for the
# smoke harness's --full mode.  When --full mode is invoked, run.py
# passes this preseed via `preseed/file=...` on the kernel cmdline so
# d-i drives every question from values here instead of prompting.
#
# Format: debconf-set-selections.  See:
#   https://www.debian.org/releases/stable/amd64/apbs04.en.html
#
# NOTE (operator) — partman is famously finicky.  This file ships
# a CONSERVATIVE single-disk full-overwrite layout.  If your test
# disk has any prior partition table, partman will halt asking what
# to do — the smoke harness will time out at that prompt.  For a
# clean first run, ensure `disk.qcow2` is a fresh blank image (run.py
# does qemu-img create from scratch each invocation, so this is
# usually fine).
#
# Inherits from installer/preseed/preseed.cfg's hostname default;
# overrides with smoke-specific values.

# ── Locale / keyboard / clock ────────────────────────────────────────
d-i debian-installer/locale          string en_US.UTF-8
d-i keyboard-configuration/xkb-keymap select us
d-i time/zone                        string UTC
d-i clock-setup/utc                  boolean true
d-i clock-setup/ntp                  boolean false

# ── Network ──────────────────────────────────────────────────────────
# QEMU user-net always gives 10.0.2.x/24 with a working route — no
# manual config needed.  Hostname comes from installer/preseed/preseed.cfg
# (`asgard`) unless overridden here.
d-i netcfg/choose_interface          select auto
d-i netcfg/get_hostname              string smoke-target
d-i netcfg/get_hostname              seen true       # smoke = no prompt
d-i netcfg/get_domain                string local
d-i netcfg/wireless_wep              string

# ── Mirror (we ship file:///cdrom/pool — apt-cdrom configures it) ────
d-i mirror/protocol                  string http
d-i mirror/country                   string manual
d-i mirror/http/hostname             string  archive.debian.org
d-i mirror/http/directory            string  /debian
d-i mirror/http/proxy                string
# Athena-specific: cdrom IS our mirror.  These keep d-i from asking.
d-i apt-setup/cdrom/set-first        boolean true
d-i apt-setup/cdrom/set-next         boolean false
d-i apt-setup/cdrom/set-failed       boolean false

# ── Accounts ─────────────────────────────────────────────────────────
# Root login disabled; create one operator account.  Passwords are
# stored in the smoke target only — DO NOT use this for any system
# you care about.  smoke-only.
d-i passwd/root-login                boolean false
d-i passwd/user-fullname             string Smoke Operator
d-i passwd/username                  string smoke
d-i passwd/user-password             password smoke
d-i passwd/user-password-again       password smoke
d-i user-setup/allow-password-weak   boolean true
d-i user-setup/encrypt-home          boolean false

# ── Partitioning ─────────────────────────────────────────────────────
# Single disk, full overwrite, atomic recipe (no /home split).
d-i partman-auto/disk                string /dev/vda
d-i partman-auto/method              string regular
d-i partman-auto-lvm/guided_size     string max
d-i partman-auto/choose_recipe       select atomic
d-i partman-partitioning/confirm_write_new_label boolean true
d-i partman/choose_partition         select finish
d-i partman/confirm                  boolean true
d-i partman/confirm_nooverwrite      boolean true
# Skip the "no swap" warning
d-i partman-basicfilesystems/no_swap boolean false

# ── Base system ──────────────────────────────────────────────────────
d-i base-installer/kernel/image      string linux-image-amd64

# ── Package selection ────────────────────────────────────────────────
# Minimum viable target: standard system utilities only.  Skip
# tasksel's interactive task picker.  Tasks beyond `standard` are
# covered by `pkg.list groups` (GROUPS-01); for the smoke test we
# don't drive into those — keeps the smoke under 10 minutes.
tasksel tasksel/first                multiselect standard
d-i pkgsel/include                   string
d-i pkgsel/upgrade                   select  none
popularity-contest popularity-contest/participate boolean false

# ── GRUB ─────────────────────────────────────────────────────────────
d-i grub-installer/only_debian       boolean true
d-i grub-installer/with_other_os     boolean false
d-i grub-installer/bootdev           string /dev/vda

# ── Finish ───────────────────────────────────────────────────────────
d-i finish-install/keep-consoles     boolean false
d-i finish-install/reboot_in_progress note
# Power off after install instead of rebooting — run.py treats QEMU
# exit as the completion signal.
d-i debian-installer/exit/poweroff   boolean true
