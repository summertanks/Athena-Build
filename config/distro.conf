# distro.conf — the UPSTREAM distribution we build FROM + our output identity.
#
# Tracked in git: a fresh `git pull` ships this as the initial template
# (Debian bookworm 12.0 → Asgard/thor).  It must contain NOTHING machine- or
# user-specific — no snapshot pin, no mirror endpoints, no host tuning, no
# signing identity.  Those are established per-machine by `configure` and the
# `container`/`mirror` commands, and live in the UNTRACKED local.conf /
# mirror.<name>.state / remote.conf / snapshot.state files.
#
# The build RECIPE (what artifacts to build — live / disk / installer, the
# package lists, source build flags) lives in the sibling build.conf.

[Build]
# target architecture - i386, amd64 or all
ARCH = amd64

# distribution — the user-visible product name (like "Ubuntu", "Debian").
# Drives /etc/os-release NAME, the GRUB menu, /etc/issue, and the hostname;
# the lowercased form is the dpkg ID namespace (/etc/os-release ID=asgard).
# A long-lived product brand, distinct from CODENAME (which rolls each release).
DISTRIBUTION = Asgard

# release codename — labels THIS release of DISTRIBUTION (Debian's "bookworm"
# slot).  Used as the apt suite name, /etc/os-release VERSION_CODENAME, the
# debootstrap script symlink, and the changelog distribution field.  Roll to a
# new value when cutting a new release.
CODENAME = thor

# distribution version — an INTEGER release number (Debian-style: 12, 13),
# incremented once per Asgard release.  Drives os-release VERSION/VERSION_ID/
# PRETTY_NAME and the `R` in our update suffix +asg<R>u<N>, so it must stay a
# clean integer for version ordering (asg2u1 > asg1u9).
VERSION = 1

# distribution channel
CHANNEL = "stable"

# When true, depth-1 Recommends of selected packages are pulled into
# selected_pkgs / selected_srcs (so source_download fetches their upstream
# tarballs) but excluded from the chroot install (live ISO stays minimal) and
# from the default source_build run (use `source_build recommended` to build
# them explicitly).  Their .debs land in repo/ for later apt-install.
IncludeRecommends = true

[Base]
# Defaults for every [Mirror.*] entry below.  Per-mirror keys override.
# To rebase the whole build to a different release, change RELEASE here.
BASEURL     = http://deb.debian.org
BASEID      = debian
RELEASE     = bookworm
BASEVERSION = 12.0

# CONTAINER_RELEASE — Debian release the build container pins to.
# Defaults to RELEASE (above), so the build toolchain tracks the target.
# Set it explicitly ONLY to hold the container behind the target — e.g.
# keep build-deps on bookworm while RELEASE advances to trixie.  Container
# release feeds the image tag and the dependency tree, so a stale mismatch
# silently skews linking; leaving it unset keeps the two in lockstep.
# CONTAINER_RELEASE = bookworm

# Each mirror composes:
#   url   = <BASEURL>/<BASEID>             (override either per-mirror)
#   suite = <RELEASE><Suffix>              (Suffix is "", "-updates", "-security")
# Mirrors are ingested in declaration order; both versions of a package
# coexist in the hashtable so the solver naturally picks the higher one.

[Mirror.main]
Suffix    =
Component = main

[Mirror.updates]
Suffix    = -updates
Component = main

[Mirror.security]
BASEID    = debian-security
Suffix    = -security
Component = main

# Non-main components.  Each [Mirror.*] ingests exactly one component, so we
# add parallel sections for contrib / non-free / non-free-firmware across the
# three suites.  Ingesting these makes their packages RESOLVABLE; we only
# actually ship a curated subset (see build.conf [Source] Tunneled +
# config/pool.list).  bookworm-security carries all four components.  Packages
# route to their component dir in repo/ via their origin Mirror.component
# (utils.deb_dest_for_filename) and publish as real components; empty
# components auto-skip at publish.
[Mirror.main-contrib]
Suffix    =
Component = contrib

[Mirror.main-non-free]
Suffix    =
Component = non-free

[Mirror.main-non-free-firmware]
Suffix    =
Component = non-free-firmware

[Mirror.updates-contrib]
Suffix    = -updates
Component = contrib

[Mirror.updates-non-free]
Suffix    = -updates
Component = non-free

[Mirror.updates-non-free-firmware]
Suffix    = -updates
Component = non-free-firmware

[Mirror.security-contrib]
BASEID    = debian-security
Suffix    = -security
Component = contrib

[Mirror.security-non-free]
BASEID    = debian-security
Suffix    = -security
Component = non-free

[Mirror.security-non-free-firmware]
BASEID    = debian-security
Suffix    = -security
Component = non-free-firmware

[Security]
# Path to the keyring used to verify each mirror's InRelease signature.
# Default points at the host-installed debian-archive-keyring; a
# derivative distro should ship its own keyring file and point here.
Keyring = /usr/share/keyrings/debian-archive-keyring.gpg

# When true, InRelease signatures are not checked and a single conspicuous
# WARN is emitted per cache build.  Intended for offline test fixtures
# and dev sandboxes only — never leave this enabled in production.
Disabled = false

# When true, run `apt-get install --simulate` in a transient container BEFORE
# every source build, print the resolved transitive build-dep set + versions,
# and prompt y/n to proceed.  Useful for hostile-mirror auditing.  A full build
# hits 800+ sources, so leaving this on globally prompts 800 times — intended
# for targeted audits (e.g. right after switching mirrors, or on a single
# suspect `source build <pkg>`).  Default false.
AuditBuildDeps = false


[Audit]
# Identity-residue scans.  Gates the two token-based audits:
#   S1 — fork-content audit at cache build time (fork_mirror.py)
#   S3 — staged-ISO audit before iso mastering (iso_installer.py)
#
# Both walk text files for Debian-identity tokens ("Debian", "debian.org",
# "discover", "reportbug", etc.) with allowlist absorption at
# `audit/identity-allowlist`.  Hard-fails the build on any unallowlisted
# hit so leakage can't silently ship to a fresh install.
#
# The S2 chroot apt-install audit (installer_chroot.py) is INDEPENDENT —
# it validates that pre-pkgsel.d / finish-install.d hook scripts only
# reference packages in our pool, with strip-the-hook allowlist at
# `installer/strip-hooks-allowlist`.  S2 stays always-on because its
# concern is install-time correctness, not Debian identity residue.
#
# Set IdentityScan = false ONLY for dev iteration on intentionally
# rebrand-incomplete forks; leave true in production so identity drift
# at upstream-rebase time fails loud at build instead of silently on the
# installed system.
IdentityScan = true


[Snapshot]
# Snapshot pinning is ON by default.  All mirror URLs are rewritten to point at
#   snapshot.debian.org/archive/<baseid>/<timestamp>/dists/...
# so cache, build container, and chroot all see the same frozen Debian.  Without
# pinning, the live mirror moves under us and produces dep-version skew between
# cache and build.  Set Enabled = false only for live-mirror experiments where
# reproducibility does not matter.
Enabled = true

# Endpoints used for snapshot resolution.  Defaults target Debian's
# snapshot service.  A derivative or fork running its own snapshot
# mirror would point these elsewhere — the snapshot scheme assumed is
# Debian's: `<BaseUrl>/<archive-key>/<TS>/dists/...`.  ArchiveKeys is
# a comma-separated list of archive trees the resolver requires
# coverage in (the picked timestamp is min(latest_per_key) so every
# key has a usable snapshot ≤ TS).
#
# The actual snapshot TIMESTAMP (the pin) is NOT tracked here — a fresh
# community pull must not inherit one machine's reproducibility point.
# It is resolved at first `configure` / `cache build` and persisted in the
# UNTRACKED config/snapshot.state sidecar (moved by `snapshot select`).
BaseUrl      = https://snapshot.debian.org/archive
TimestampApi = https://snapshot.debian.org/mr/timestamp/
ArchiveKeys  = debian, debian-security


[Directories]
Log = log
Cache = cache
Temp = tmp
Source = source
Build = build
Repo = repo
# Snapshot-pinned local apt mirror of the build closure (CreateLocalMirror,
# machine-local).  Build containers add it as their first apt source so
# build-deps come from local disk instead of snapshot.debian.org each time.
LocalMirror = localmirror
Config = config
Patch = patch
# Athena-owned Debian source packages that supersede or extend
# upstream — built from local trees under <Fork>/source/<pkg>/
# instead of via apt-get source.  Walked at cache-build time for
# self-discovery (see scripts/fork_discovery.py).  See
# docs/plans/fork-source.md and fork/source/README.md.
Fork = fork
Image = image
Chroot = buildroot
# Isolated gnupg homedir used by verify_inrelease() to verify mirror
# InRelease signatures.  Created and chmod 0700 by build-system.sh.
Gnupg = gnupg
