[Build]
# target architecture - i386, amd64 or all
ARCH = amd64

# distribution name
NAME = "Athena Linux"

# distribution — the user-visible product name (akin to "Ubuntu",
# "Debian").  Shows on /etc/os-release NAME, GRUB menu ("Install
# Asgard"), /etc/issue, hostname (lowercased), and the
# DISTRIB_ID/DISTRIB_DESCRIPTION on lsb-release shipped via the
# fork installer-data udeb.  Lowercased form is also the dpkg ID
# namespace (/etc/os-release ID=asgard).
#
# Distinct from CODENAME below: distribution is the long-lived
# product brand; codename rolls with each release (Debian:
# bookworm → trixie → forky).
DISTRIBUTION = Asgard

# release codename — labels THIS release of DISTRIBUTION (Debian's
# "bookworm" slot).  Used as:
#   - apt suite name (Suite: thor in Release files)
#   - /etc/os-release VERSION_CODENAME=thor
#   - debootstrap script symlink (/usr/share/debootstrap/scripts/thor)
#   - changelog stanza distribution field
# Roll to a new value when cutting a new release; the value here
# is the codename for whatever release VERSION below tags.
CODENAME = thor

# distribution version
VERSION = 0.1

# distribution channel
CHANNEL = "stable"

# number of source packages to build in parallel
MaxParallelBuilds = 1

# When true, depth-1 Recommends of selected packages are pulled into
# selected_pkgs / selected_srcs (so source_download fetches their
# upstream tarballs) but excluded from the chroot install (live ISO
# stays minimal) and from the default source_build run (use
# `source_build recommended` to build them explicitly).  Their .debs
# end up in repo/ for future apt-install once the apt-repo metadata
# work lands.
IncludeRecommendsInRepo = true

# base release for the build container image (independent of BASECODENAME)
CONTAINER_RELEASE = bookworm

# external Docker daemon URL (leave blank to use local socket)
# DOCKER_SERVER = tcp://192.168.1.100:2375

[Base]
# Defaults for every [Mirror.*] entry below.  Per-mirror keys override.
# To rebase the whole build to a different release, change RELEASE here.
BASEURL     = http://deb.debian.org
BASEID      = debian
RELEASE     = bookworm
BASEVERSION = 12.0

# Each mirror composes:
#   url   = <BASEURL>/<BASEID>             (override either per-mirror)
#   suite = <RELEASE><Suffix>              (Suffix is "", "-updates", "-security")
# Mirrors are ingested in declaration order; both versions of a package
# coexist in the hashtable so the solver naturally picks the higher one.

[Mirror.main]
Suffix    =
Component = main

[Mirror.updates]
Suffix    = -updates
Component = main

[Mirror.security]
BASEID    = debian-security
Suffix    = -security
Component = main

[Security]
# Path to the keyring used to verify each mirror's InRelease signature.
# Default points at the host-installed debian-archive-keyring; a
# derivative distro should ship its own keyring file and point here.
Keyring = /usr/share/keyrings/debian-archive-keyring.gpg

# When true, InRelease signatures are not checked and a single conspicuous
# WARN is emitted per cache build.  Intended for offline test fixtures
# and dev sandboxes only — never leave this enabled in production.
Disabled = false


[Snapshot]
# Snapshot pinning is ON by default.  All mirror URLs are
# rewritten to point at
#   snapshot.debian.org/archive/<baseid>/<timestamp>/dists/...
# so cache, build container, and chroot all see the same frozen Debian.
# Without pinning, the live mirror moves under us and produces
# dep-version skew between cache and build (the openssl
# 3.0.18→3.0.19 case).  Set Enabled = false only for live-mirror
# experiments where reproducibility does not matter.
Enabled = true

# "latest" → resolve via snapshot.debian.org JSON API on first run, persist
# the resolved value to cache/snapshot.timestamp so subsequent runs are
# reproducible.  Delete that file (or use --refresh-snapshot) to advance.
# Or set explicitly, e.g. Timestamp = 20260506T120451Z
#
# Pinned 2026-05-19 to the last known-good snapshot.  The May-18 advance
# from `latest` pulled in +deb12u14/+~deb12u2 security updates AND
# triggered the linux ABI counter to walk forward (47 → 49), which
# cascades into a full-corpus rebuild because the predictor expects
# Debian's ABI but our `_changelog_bump` adds 1 more.  See CONF-13.
# Roll forward to `latest` (or a newer fixed TS) once that's resolved.
Timestamp = 20260514T083402Z

# Endpoints used for snapshot resolution.  Defaults target Debian's
# snapshot service.  A derivative or fork running its own snapshot
# mirror would point these elsewhere — the snapshot scheme assumed is
# Debian's: `<BaseUrl>/<archive-key>/<TS>/dists/...`.  ArchiveKeys is
# a comma-separated list of archive trees the resolver requires
# coverage in (the picked timestamp is min(latest_per_key) so every
# key has a usable snapshot ≤ TS).
BaseUrl      = https://snapshot.debian.org/archive
TimestampApi = https://snapshot.debian.org/mr/timestamp/
ArchiveKeys  = debian, debian-security


[Directories]
Log = log
Download = download
Cache = cache
Temp = tmp
Source = source
Build = build
Repo = repo
Config = config
Patch = patch
# Athena-owned Debian source packages that supersede or extend
# upstream — built from local trees under <Fork>/source/<pkg>/
# instead of via apt-get source.  Walked at cache-build time for
# self-discovery (see scripts/fork_discovery.py).  See
# docs/plans/fork-source.md and fork/source/README.md.
Fork = fork
Image = image
Chroot = buildroot
# Isolated gnupg homedir used by verify_inrelease() to verify mirror
# InRelease signatures.  Created and chmod 0700 by build-system.sh.
Gnupg = gnupg

[Source]
SkipTest =
# SkipTest = systemd, libsoup2.4, libpsl, libical3, lilv, procps, keyutils, vim

# DEB_BUILD_OPTIONS — controls how the build itself behaves.
#   nodoc          skip building/installing documentation
#   nocheck        skip running test suites
#   noautodbgsym   skip emitting auto -dbgsym companion .debs.  Binaries
#                  still get stripped + debuglinked, so a future gdb
#                  attach can rehydrate symbols from a sibling pkg if
#                  one ever shows up — we just don't ship them by
#                  default.  Saves ~3-4 GB on a full build (no
#                  pkg-dbgsym_*.deb in repo/), faster source builds.
#                  dh_strip honours both `noautodbgsym` and the older
#                  `noddebs` alias.
# Other options accepted but NOT used here:
#   nostrip        leave debug symbols IN binaries (opposite of want)
#   noopt          compile with -O0 (we want optimized)
#   parallel=N     hint inner `make -j N`; we let dpkg-buildpackage
#                  pick via MaxParallelBuilds at the outer layer
#   terse          quieter build output (--no-print-directory)
#   hardening=… reproducible=… abi=… future=… qa=… optimize=…
#                  sanitize=…  dpkg-buildflags feature groups (defaults)
BuildOptions = nodoc, nocheck, noautodbgsym

# DEB_BUILD_PROFILES — which Build-Depends annotations are active.
# `<!nodoc>` deps drop out under nodoc, `<!nocheck>` drops under
# nocheck, etc.  Same names as BuildOptions but a different namespace.
#
# noinsttest is paired with nocheck because Debian build-profile syntax
# OR's adjacent <...> groups: a dep marked `<!nocheck> <!noinsttest>`
# stays active unless BOTH profile groups fail — i.e. unless BOTH
# nocheck AND noinsttest are set.  Setting only nocheck leaves these
# deps active and dpkg-checkbuilddeps fails (e.g. libsoup2.4 pulling
# php/apache, which aren't in our pool).  noinsttest also skips
# installable-test binary stanzas (gtk4/ibus/gtksourceview5 ship
# test binaries gated on `Build-Profiles: <!noinsttest>`) — we don't
# want those binaries either, so this is a clean addition.
BuildProfiles = nodoc, nocheck, noinsttest
# Packages in this list are downloaded directly from the base Debian repo
# instead of being built from source (comma-separated source package names)
Tunneled =
# Tunneled = gcc-12, linux

# Version policy: binaries ship at the pristine upstream source version.
# After `dpkg-buildpackage`, BuildContainer runs utils.strip_nmu_from_deb
# on every produced .deb/.udeb to:
#   1. Strip NMU/binNMU/backport suffix from the binary's own Version
#      (`+bN`, `+debNuN`, `~bpoN+N`, `+rpiN`, legacy `-Nb`)
#   2. Strip the same suffixes from every version constraint in
#      Depends / Pre-Depends / Recommends / Suggests / Enhances /
#      Provides / Conflicts / Breaks / Replaces
#
# Result: a self-consistent repo where every internal cross-reference
# resolves at the pristine source version.  Provenance lives in the
# Release file's `Origin: Athena` header, not the binary version string.
#
# `package audit_nmu` verifies that nothing in repo/ slipped past the
# strip; `package strip` one-time-backfills an existing corpus.
# `package audit_deps` is the orthogonal closure check (every dep
# resolves against the actual repo + Provides index).

[Repo]
# Identity for the project's signing key.  Used by:
#   `generate_signing_key`   to create the keypair (one-time setup)
#   `verify_signing_key`     to sanity-check the key (sign+verify roundtrip)
#   `print signing`          to show the key's identity + state
#   cmd_index_repo (Phase 2) to sign Release / produce InRelease
# Format: 'Name <email>' — gpg parses Name-Real + Name-Email from this.
# Private key lives in <Gnupg>/signing/ (separate from the verification
# keyring at <Gnupg>/) — different trust scopes, no cross-contamination.
SigningKeyUid = Athena Build <athena@local>

# CONF-02: optional network apt source for the installed system.
# When set, the installed Asgard system gets
#   /etc/apt/sources.list.d/athena.list
#     deb [signed-by=/usr/share/keyrings/athena-archive-keyring.gpg] <url> <codename> main
# pointing at the published Athena repo (Release signed by SigningKeyUid).
# Set this to the HTTP(S) URL the repo is served at once published (COMP-02);
# leave empty until then — an unreachable URL would only make `apt update`
# fail.  When empty, the target relies on the /cdrom/pool source added at
# install time.
AptSourceURL = http://140.245.198.222/asgard/ 

# COMP-02: rsync-over-SSH publish target for `repo publish ssh [full|minimal]`.
# Just `user@host` (repo goes under the remote home) or `user@host:/base`
# (repo goes under that dir).  The repo folder name is NOT set here — it's
# derived from the distribution id ([Build] DISTRIBUTION lowercased), so the
# repo lands at <base-or-home>/<dist-id>/ (e.g. ~/asgard/) and follows a
# rebrand automatically.  Publish rsyncs there (incremental; --delete keeps
# it a true mirror).  Point AptSourceURL (above) at the HTTP(S) URL a web
# server on the VM serves that folder at.  Empty = `repo publish ssh`
# refuses.  Auth: ssh-agent / default key, or set PublishSshKey.
#
# The <dist-id> dir must EXIST on the VM first (publish doesn't create it):
#   ssh -i config/repo_asgard.key ubuntu@140.245.198.222 mkdir -p asgard
#
# NOTE: the host's SSH fingerprint must already be accepted (in
# ~/.ssh/known_hosts) BEFORE running `repo publish ssh` — publish runs
# non-interactively (piped, no terminal), so ssh can't prompt to trust a
# new host and rsync fails with "Host key verification failed".  Accept it
# once with a manual connect, e.g.:
#   ssh -i config/repo_asgard.key ubuntu@140.245.198.222 echo ok
PublishSshTarget = ubuntu@140.245.198.222
PublishSshKey = config/repo_asgard.key
