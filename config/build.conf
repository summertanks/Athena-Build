# build.conf — the build RECIPE: what artifacts we assemble and how.
#
# Tracked in git as the end-user-editable template.  It says WHICH surfaces to
# build (live / disk image group composition), which package-list files drive
# selection, and the source-build flags.  It carries NOTHING machine-specific
# (host tuning, mirror/remote endpoints, signing identity live in the untracked
# local.conf / mirror.<name>.state / remote.conf).
#
# The upstream we build FROM + output identity (Base / Mirror / Snapshot /
# Security / Directories) lives in the sibling distro.conf.

# Per-surface group composition.  Each surface's chroot installs the dependency
# CLOSURE of the listed groups' seeds (over the resolved graph, not group
# deltas).  ssh-server rides [base] (openssh-server is a base seed).
[Live]
# The live image: GNOME desktop experience (+ Recommends of the set).
Groups = base, gnome-desktop

[Disk]
# The pre-installed qcow2 disk image: minimal console system.
Groups = base

# Package-list files that drive selection (filenames resolved relative to
# config/).  These formalise what used to be hardcoded paths; rename here only
# if you rename the list files.  An explicit --pkg-list/--pool-list/… CLI flag
# still overrides.
[Packages]
Pkg_List       = pkg.list
Pool_List      = pool.list
Live_List      = live.list
Installer_List = installer.list
Build_Pkg_List = build_pkg.list

[Source]
SkipTest =
# SkipTest = systemd, libsoup2.4, libpsl, libical3, lilv, procps, keyutils, vim

# DEB_BUILD_OPTIONS — controls how the build itself behaves.
#   nodoc          skip building/installing documentation
#   nocheck        skip running test suites
#   noautodbgsym   skip emitting auto -dbgsym companion .debs.  Binaries
#                  still get stripped + debuglinked, so a future gdb
#                  attach can rehydrate symbols from a sibling pkg if
#                  one ever shows up — we just don't ship them by
#                  default.  Saves ~3-4 GB on a full build (no
#                  pkg-dbgsym_*.deb in repo/), faster source builds.
#                  dh_strip honours both `noautodbgsym` and the older
#                  `noddebs` alias.
# Other options accepted but NOT used here:
#   nostrip        leave debug symbols IN binaries (opposite of want)
#   noopt          compile with -O0 (we want optimized)
#   parallel=N     hint inner `make -j N`; we let dpkg-buildpackage
#                  pick via MaxParallelBuilds at the outer layer
#   terse          quieter build output (--no-print-directory)
#   hardening=… reproducible=… abi=… future=… qa=… optimize=…
#                  sanitize=…  dpkg-buildflags feature groups (defaults)
BuildOptions = nodoc, nocheck, noautodbgsym

# DEB_BUILD_PROFILES — which Build-Depends annotations are active.
# `<!nodoc>` deps drop out under nodoc, `<!nocheck>` drops under
# nocheck, etc.  Same names as BuildOptions but a different namespace.
#
# noinsttest is paired with nocheck because Debian build-profile syntax
# OR's adjacent <...> groups: a dep marked `<!nocheck> <!noinsttest>`
# stays active unless BOTH profile groups fail — i.e. unless BOTH
# nocheck AND noinsttest are set.  Setting only nocheck leaves these
# deps active and dpkg-checkbuilddeps fails (e.g. libsoup2.4 pulling
# php/apache, which aren't in our pool).  noinsttest also skips
# installable-test binary stanzas (gtk4/ibus/gtksourceview5 ship
# test binaries gated on `Build-Profiles: <!noinsttest>`) — we don't
# want those binaries either, so this is a clean addition.
BuildProfiles = nodoc, nocheck, noinsttest

# Per-package overrides via `[Source.<pkg>]` sections.  Either key
# (BuildOptions / BuildProfiles) may be set; absent keys fall back to the
# global value above.  A per-invocation `[bracket]` token on `source build
# <pkg> [nocheck]` overrides BOTH for that one invocation, on top of the
# per-pkg override.  Use sparingly — an escape hatch for sources the global
# axis can't express.
#
# Example (uncomment when needed):
#   [Source.firefox-esr]
#   # Cap inner make parallelism to keep cc1plus under the OOM threshold.
#   BuildOptions = nodoc, nocheck, noautodbgsym, parallel=1

# Packages in this list are downloaded directly from the base Debian repo
# instead of being built from source (comma-separated SOURCE package names).
# Tunnel = redistribute Debian's pristine signed binary as-is (never patched
# or asg-stamped); the on-disk filename keeps its upstream ~debNuN suffix so
# the .deb's filename matches its control Version.  These are SOURCE names;
# the specific BINARIES shipped are curated in config/pool.list:
#   intel-microcode  → binary intel-microcode        (non-free-firmware)
#   amd64-microcode  → binary amd64-microcode        (non-free-firmware)
#   firmware-nonfree → binaries firmware-iwlwifi / -realtek / -atheros /
#                      -brcm80211 / -misc-nonfree / -amd-graphics (the subset
#                      selected in pool.list)         (non-free-firmware)
#
# NOTE: shim-signed / shim-helpers-amd64-signed are intentionally NOT
# tunneled.  Athena ships no Secure Boot support today (see
# docs/plans/secboot-01-mok-self-sign.md).  Until that lands, machines with
# Secure Boot mandatorily on need it disabled in firmware setup.
Tunneled = intel-microcode, amd64-microcode, firmware-nonfree

# HeavyPackages — comma-separated source names the parallel scheduler
# treats as "build alone": when the next ready job is in this set, all
# in-flight builds drain first, and while it runs no new builds start.
# A property of the packages (heavy on any host); the actual parallelism
# is the per-machine MaxParallelBuilds in local.conf.  Use sparingly — the
# list ages poorly.  Empty = no heavy-package serialization.
HeavyPackages = firefox-esr, gcc-12, libreoffice, llvm-toolchain-15, linux, webkit2gtk

# Version policy: binaries ship at the pristine upstream source version.
# After `dpkg-buildpackage`, BuildContainer runs utils.strip_nmu_from_deb
# on every produced .deb/.udeb to strip NMU/binNMU/backport suffixes from
# the binary's own Version and from every dep version constraint, yielding a
# self-consistent repo where every internal cross-reference resolves at the
# pristine source version.  Provenance lives in the Release file's
# `Origin: Athena` header, not the binary version string.  `repo audit`
# verifies nothing slipped past the strip; `repo repair strip` backfills.
