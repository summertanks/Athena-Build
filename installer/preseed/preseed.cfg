# installer/preseed/preseed.cfg
#
# Default preseed values for the Athena installer.  Loaded at boot by
# /lib/debian-installer-startup.d/S25-load-preseed (see
# installer/preseed/load-preseed.sh).  Stock d-i has no auto-loader
# for /preseed.cfg in the initrd — our loader fills that gap.
#
# Format: debconf-set-selections.  See ./README.md.
#
# Empty by design — every preseed value tried so far has been a no-op
# for our problem (the failing apt-cdrom-setup chain doesn't honor the
# obvious knobs like apt-setup/disable-cdrom-entries in our build).
# Add specific values here when we have evidence they take effect.
