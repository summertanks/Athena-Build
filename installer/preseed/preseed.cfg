# installer/preseed/preseed.cfg
#
# Default preseed values for the Athena installer.  Loaded at boot by
# stock d-i's /lib/debian-installer-startup.d/S30initrd-preseed via
# the `auto=true preseed/file=/preseed.cfg` kernel cmdline set in
# installer/boot/grub.cfg.  Overlaid into the installer chroot by
# scripts/installer_chroot.py:_OVERLAY_MAP at chroot-build time.
#
# Format: debconf-set-selections.  See ./README.md.
#
# Note: this file is NOT routed through fork/'s @TOKEN@ substitution
# pass — it's overlaid into the installer chroot verbatim by
# scripts/installer_chroot.py _apply_installer_overlay.  Keep values
# literal (matching the post-substitution shape of build.conf).

# Hostname default shown on the netcfg "Hostname:" prompt.  Stock d-i
# ships `Default: debian` in netcfg's templates — surface where our
# distribution identity leaks at install time.  Override to the
# lowercased distribution identity (Asgard → "asgard"); matches
# BuildConfig.build_base_id.  DHCP-supplied hostname still wins when
# present (netcfg's dhcp.c reseeds this key from interface->dhcp_
# hostname before the prompt fires) — desired behaviour.
#
# `seen false` re-enables the prompt: our grub.cfg passes
# `auto=true` on the kernel cmdline, which sets
# DEBCONF_NONINTERACTIVE_SEEN=true globally — under that mode every
# preseeded answer would be silently used and the user would never
# see the prompt.  Setting seen=false for this specific question
# tells debconf "value preseeded but treat as not-yet-shown" — so
# the input box appears with `asgard` filled in as the default,
# matching the operator-changeable behaviour we want.
d-i netcfg/get_hostname string asgard
d-i netcfg/get_hostname seen false

# Network mirror — we ship a forked choose-mirror whose list is Athena-only
# (fork/source/choose-mirror), so the standard mirror step appears showing
# only our mirror.  Skip the protocol sub-question (always http) and pin the
# suite/codename to our release so choose-mirror validates against
# <mirror>/dists/thor/Release.  We do NOT set apt-setup/use_mirror — the
# "Use a network mirror?" step stays visible.  (NB: suite/codename keys may
# need adjusting once observed on a real install — see
# docs/plans/comp-01-choose-mirror-fork.md.)
d-i mirror/protocol string http
d-i mirror/suite string thor
d-i mirror/codename string thor
