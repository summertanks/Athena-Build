# installer/preseed/preseed.cfg
#
# Default preseed values for the Athena installer.  Loaded at boot by
# stock d-i's /lib/debian-installer-startup.d/S30initrd-preseed via
# the `auto=true preseed/file=/preseed.cfg` kernel cmdline set in
# installer/boot/grub.cfg.  Overlaid into the installer chroot by
# scripts/installer_chroot.py:_OVERLAY_MAP at chroot-build time.
#
# Format: debconf-set-selections.  See ./README.md.
#
# Note: this file is NOT routed through fork/'s @TOKEN@ substitution
# pass — it's overlaid into the installer chroot verbatim by
# scripts/installer_chroot.py _apply_installer_overlay.  Keep values
# literal (matching the post-substitution shape of build.conf).

# Hostname default shown on the netcfg "Hostname:" prompt.  Stock d-i
# ships `Default: debian` in netcfg's templates — surface where our
# distribution identity leaks at install time.  Override to the
# lowercased distribution identity (Asgard → "asgard"); matches
# BuildConfig.build_base_id.  DHCP-supplied hostname still wins when
# present (netcfg's dhcp.c reseeds this key from interface->dhcp_
# hostname before the prompt fires) — desired behaviour.
#
# `seen false` re-enables the prompt: our grub.cfg passes
# `auto=true` on the kernel cmdline, which sets
# DEBCONF_NONINTERACTIVE_SEEN=true globally — under that mode every
# preseeded answer would be silently used and the user would never
# see the prompt.  Setting seen=false for this specific question
# tells debconf "value preseeded but treat as not-yet-shown" — so
# the input box appears with `asgard` filled in as the default,
# matching the operator-changeable behaviour we want.
d-i netcfg/get_hostname string asgard
d-i netcfg/get_hostname seen false

# Network mirror — we ship a forked choose-mirror whose list is Athena-only
# (fork/source/choose-mirror).  Pin protocol/suite/codename so choose-mirror
# validates against <mirror>/dists/thor/Release.
#
# ASK "Use a network mirror?" (default yes) rather than forcing it: `seen false`
# surfaces the question under `auto=true` (same trick as netcfg/get_hostname
# above), so the operator can decline (cdrom-only).  On yes, 50mirror invokes
# choose-mirror and writes the Athena mirror to the target's sources.list.
d-i apt-setup/use_mirror boolean true
d-i apt-setup/use_mirror seen false
# Skip the mirror-country step — preseed the country (masterlist Country: US) so
# choose-mirror's choose_country finds it set+seen and goes straight to the
# server list (no country prompt).  'enter manually' lives in the country step,
# so it is not offered in this flow (accepted trade-off).
d-i mirror/country string US
d-i mirror/protocol string http
d-i mirror/suite string thor
d-i mirror/codename string thor

# Suppress the apt "services" step (security / release-updates / backports).
# We don't publish thor-updates/thor-backports suites, so offering them only
# yields "repository couldn't be accessed" 404s.  Empty + seen (auto=true) means
# 90services-select's `db_input` never fires → the 3 options don't appear →
# 91services stays dormant → no extra sources.list lines.  Re-enable per-suite
# here once we actually publish an updates/security layer.
d-i apt-setup/services-select multiselect

# Keep the target's mirror line to `main`, no deb-src — our repo ships only the
# `main` component and no source index, so anything else makes `apt update` warn
# about a missing component / Sources file.
#
# non-free-firmware: hw-detect's post-base-installer.d/50install-firmware detects
# the CPU vendor, queues microcode, and `db_set apt-setup/non-free-firmware=true`
# — which OVERRIDES a preseed of that key.  So disable the firmware-lookup
# machinery itself (its documented escape hatch) rather than the component key;
# then non-free-firmware is never enabled and 50mirror writes `main` only.
# Re-enable once the repo carries a non-free-firmware component + microcode.
d-i hw-detect/firmware-lookup string never
# deb-src: apt-setup/enable-source-repositories defaults true; our repo has no
# Sources index, so drop the deb-src line.  Nothing db_set's this key, so the
# preseed sticks.
d-i apt-setup/enable-source-repositories boolean false
