# installer/boot/grub.cfg — default boot menu for the installer ISO.
#
# This is the data-layer template the engine copies to
#   <iso-stage>/boot/grub/grub.cfg
# at iso-build time.  Engine never inspects contents — operator can
# rewrite freely to add menu entries (expert install, rescue, oem-config)
# or change kernel cmdline.  See installer/boot/README.md.
#
# Boot flow:
#   BIOS/UEFI → grub loads /boot/vmlinuz + /boot/initrd.gz
#   kernel boots into initrd
#   PID 1 = rootskel's /sbin/init
#   rootskel run-parts scripts launch cdebconf + main-menu
#   operator answers prompts; install steps run
#
# DEBUG MODE: this entry currently has serial console enabled for
# capture.  Run QEMU one of two ways:
#   # serial mirrored to host terminal alongside the graphical UI:
#   qemu-system-x86_64 -m 2G -cdrom image/athena-installer-*.iso -boot d \
#                      -serial mon:stdio
#   # serial captured to a file:
#   qemu-system-x86_64 -m 2G -cdrom image/athena-installer-*.iso -boot d \
#                      -serial file:/tmp/installer.log
# d-i's per-step syslog still goes to tty5 inside the VM (switch via
# Ctrl-Alt-F5 in the QEMU graphical window).  For a non-debug ISO,
# strip the `console=ttyS0,...` term and re-add `quiet`.

set default=0
set timeout=5

menuentry "Install Athena" {
    # ramdisk_size=131072 (128M) leaves headroom above the ~50M initrd.
    # Multiple console= terms: the kernel writes to ALL of them, but the
    # LAST one is the "active" system console (where stdin connects and
    # cdebconf-newt opens its TTY).  Ordering chosen to:
    #   - put kernel + early-userspace messages on ttyS0 for serial capture
    #   - keep cdebconf-newt's UI on tty0 (the QEMU graphical window)
    # `quiet` removed so kernel boot chatter surfaces — the noise is the
    # debug signal in this mode.
    linux  /boot/vmlinuz ramdisk_size=131072 console=ttyS0,115200n8 console=tty0
    initrd /boot/initrd.gz
}
