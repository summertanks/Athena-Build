# installer/boot/grub.cfg — default boot menu for the installer ISO.
#
# This is the data-layer template the engine copies to
#   <iso-stage>/boot/grub/grub.cfg
# at iso-build time.  Engine never inspects contents — operator can
# rewrite freely to add menu entries (expert install, rescue, oem-config)
# or change kernel cmdline.  See installer/boot/README.md.
#
# Boot flow:
#   BIOS/UEFI → grub loads /boot/vmlinuz + /boot/initrd.gz
#   kernel boots into initrd
#   PID 1 = rootskel's /sbin/init
#   rootskel run-parts scripts launch cdebconf + main-menu
#   operator answers prompts; install steps run
#
# DEBUG MODE: serial logging is via a one-way userspace sink, NOT the
# kernel console.  The hook at
# /lib/debian-installer-startup.d/S99-syslog-to-serial tails
# /var/log/syslog to /dev/ttyS0 so an operator with serial capture
# (QEMU `-serial`, VMware serial port → file/pipe) sees install
# progress.  The kernel cmdline has no `console=ttyS0` term — keeping
# the serial port out of the kernel's console list means cdebconf-newt
# never picks ttyS0 as its controlling tty, so the UX in the
# graphical / VMware console stays clean.
#
# `quiet` removed so VGA-side boot chatter still surfaces — drop this
# for a quiet operator-facing ISO.

set default=0
set timeout=5

menuentry "Install Asgard" {
    # ramdisk_size=131072 (128M) leaves headroom above the ~50M initrd.
    # No `console=` term — kernel defaults to the firmware console
    # (VGA in QEMU/VMware → tty0).  cdebconf-newt opens on tty1
    # (the operator's graphical console).  ttyS0 is reachable as a
    # plain character device for the userspace syslog tail hook; the
    # 8250 driver creates /dev/ttyS0 regardless of `console=`.
    #
    # `auto=true preseed/file=/preseed.cfg` — stock d-i kernel-cmdline
    # preseed loader.  preseed-common.udeb (already in installer.list)
    # reads these at boot and runs `debconf-set-selections /preseed.cfg`
    # before any consumer udeb queries the values.  This replaces the
    # prior installer/preseed/load-preseed.sh overlay (deleted
    # 2026-05-12) — using the stock mechanism instead of a custom
    # startup script means we don't have to maintain a tiny shell
    # script that races S20templates / S60auto-install.  `auto=true`
    # additionally raises debconf priority to critical (skips
    # non-critical questions) which matches the unattended-install
    # intent of having a preseed at all.
    linux  /boot/vmlinuz ramdisk_size=131072 auto=true preseed/file=/preseed.cfg
    initrd /boot/initrd.gz
}
